services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: circle_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-circle_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - circle_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-circle_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  circle_pgdata:
